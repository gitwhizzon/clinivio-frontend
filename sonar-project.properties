# SonarCloud project configuration for clinivio-frontend.
#
# sonar.organization must match your SonarCloud organization key exactly
# (sonarcloud.io -> Organization -> Administration -> Organization key).
# "whizzgit" is a placeholder based on the GitHub org (WhizzGit) -- update
# it if SonarCloud assigned you a different slug during setup.
sonar.projectKey=WhizzGit_clinivio-frontend
sonar.organization=whizzgit

# Monorepo layout: main hospital portal at src/, patient portal at apps/patient/src
sonar.sources=src,apps/patient/src

sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/*.d.ts,apps/patient/e2e/**,apps/patient/playwright-report/**

# Produced by `pnpm test:cov` (jest --coverage, lcov reporter on by default)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Fail the CI job (not just report) when the Quality Gate doesn't pass, so
# "SonarCloud Scan" can be used as a required branch-protection status check.
sonar.qualitygate.wait=true
